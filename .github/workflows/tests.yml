name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}${{ matrix.stability == 'prefer-lowest' && ' · lowest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', testbench: '^8.0',  stability: prefer-lowest }
          - { php: '8.1', laravel: '10', testbench: '^8.0',  stability: prefer-stable }
          - { php: '8.2', laravel: '11', testbench: '^9.0',  stability: prefer-stable }
          - { php: '8.3', laravel: '12', testbench: '^10.0', stability: prefer-stable }
          - { php: '8.4', laravel: '13', testbench: '^11.0', stability: prefer-stable }
          - { php: '8.5', laravel: '13', testbench: '^11.0', stability: prefer-stable }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite Unit,Laravel

  yii2:
    name: PHP ${{ matrix.php }} · Yii2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer config repositories.asset-packagist composer https://asset-packagist.org
          composer config allow-plugins.yiisoft/yii2-composer true
          composer remove --dev --no-update orchestra/testbench
          composer require --dev --no-update "yiisoft/yii2:^2.0.50"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite Unit,Yii2

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github
